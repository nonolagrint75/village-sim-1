[package]
name = "sim_core"
version = "0.1.0"
edition = "2021"
description = "Optional WASM kernels for village-sim (pathfinding / grid). Build with wasm-pack; TS fallback remains default."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
